kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: efs-static-pvc

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: "pv-efs-static"
  resources:
    requests:
      storage: "5Gi"

---
kind: Pod
apiVersion: v1
metadata:
  name: efs-static-pod
  labels:
    purpose: efs-static
spec:
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
      - name: persistent-storage
        mountPath: /usr/share/nginx/html
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: "pv-efs-static"

---
kind: Service
apiVersion: v1
metadata: 
  name: efs-static-svc-lb
spec:
  type: LoadBalancer
  selector:
      purpose: "efs-static"
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30009

