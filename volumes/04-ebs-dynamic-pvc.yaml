kind: PersistentVolumeClaim
apiVersion: v1
metadata: 
  name: ebs-dynamic-pvc
spec:
  storageClassName: "ebs-sc"
  resources:
    requests:
      storage: "29Gi"
  accessModes:
    - ReadWriteOnce

---
kind: Pod
apiVersion: v1
metadata:
  name: dynamic-pod
  labels:
    purpose: ebs-dynamic
spec:
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
      - name: persistent-storage
        mountPath: /usr/share/nginx/html
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: "ebs-dynamic-pvc"

---
kind: Service
apiVersion: v1
metadata: 
  name: ebs-dynamic-svc-lb
spec:
  type: LoadBalancer
  selector:
    labels:
      purpose: ebs-dynamic
  ports:
  - protocol: "TCP"
    port: 80
    targetPort: 80
    nodePort: 30008

