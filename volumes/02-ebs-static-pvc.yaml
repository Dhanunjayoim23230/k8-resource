apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: vrushali-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi

---
kind: Service
apiVersion: v1
metadata:
  name: internal-service-np
  namespace: prod
spec:
  type: NodePort
  selector:
    course: devops
    trainer: dhanunjaya
    application: backend
    version: clusterIP
    demo: np
  ports:
  - name: name-of-service-port
    protocol: "TCP"
    port: 80
    targetPort: 8080
    nodePort: 30007


---
kind: Pod
apiVersion: v1
metadata:
  name: servicepod-np
  namespace: prod
  labels:
    course: devops
    trainer: dhanunjaya
    application: backend
    version: clusterIP
    demo: np
spec:
  containers:
  - name: nginx
    image: nginx