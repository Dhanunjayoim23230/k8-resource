apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: pv-prod
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi


---
kind: Pod
apiVersion: v1
metadata:
  name: ebs-static
  labels:
    demo: pvc
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-static

---
kind: Service
apiVersion: v1
metadata:
  name: loadBalancer
spec:
  type: LoadBalancer
  selector:
    demo: pvc
  ports:
  - name: name-of-service-port
    protocol: "TCP"
    port: 80
    targetPort: 8080
    nodePort: 30007