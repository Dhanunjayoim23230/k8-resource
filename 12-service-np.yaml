kind: Service
apiVersion: v1
metadata:
  name: internal-service-np
  namespace: prod
spec:
  type: NodePort
  selector:
    course: devops
    trainer: dhanunjaya
    application: backend
    version: clusterIP
    demo: np
  ports:
  - name: name-of-service-port
    protocol: "TCP"
    port: 80
    targetPort: 8080
    nodePort: 3007


---
kind: Pod
apiVersion: v1
metadata:
  name: servicepod-np
  namespace: prod
  labels:
    course: devops
    trainer: dhanunjaya
    application: backend
    version: clusterIP
    demo: np
spec:
  containers:
  - name: nginx
    image: nginx