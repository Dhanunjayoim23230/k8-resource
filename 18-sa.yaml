#Pod accessing kubectl from another POD, POD accessing default namespace and checking howmany pods running
#install kubectl in pod
#Using SA it can access the  internal resourcess/objects
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sa-role
  namespace: expense
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get","watch","list"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io
metadata:
  name: sa-rb
  namespace: expense
subjects:
- kind: ServiceAccount
  name: expense-mysql-secret
  namespace: expense
roleRef:
  kind: Role
  name: sa-role
  apiGroup: rbac.authorization.k8s.io


#Secrets fetching by init container and sharing to main pod
---
apiVersion: v1
kind: Pod
metadata:
  name: sa-pod
  namespace: expense
spec:
  serviceAccount: expense-mysql-secret # this POD running with role & role binding to access the internal resources
  initContainers:
  - name: aws-cli
    image: amazonlinux:2023
    # command: ['sh', '-c', 'aws secretsmanager get-secret-value --secret-id expense/mysql/creds --query SecretString --output text > /secrets/.env ']
    command: ['sh', '-c']
    args:
    - |
      yum install -y unzip awscli
      aws secretsmanager get-secret-value --secret-id expense/mysql/creds --query SecretString --output text > /secrets/.env
    volumeMounts:
    - mountPath: /secrets
      name: secret-volume
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - mountPath: /secrets
      name: secret-volume
  volumes:
  - name: secret-volume
    emptyDir: {}
  

