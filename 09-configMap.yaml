kind: ConfigMap
apiVersion: v1
metadata:
  name: configmap
  namespace: prod
data:
  course: devops
  practice: mac


---
kind: Pod
apiVersion: v1
metadata:
  name: configpod
  namespace: prod
  labels: 
    envFrom:
      - configMapRef:
          name: configmap
spec:
  containers:
    - name: nginx
      image: nginx
     