kind: Pod
apiVersion: v1
metadata:
  name: pod-init
  namespace: expense
spec:
  initContainers:
  - name: init-container
    imgae: busybox:1.28
    #command: ['sh', '-c', "until nslookup googfadfle.com; do echo waiting for myservice; sleep 10; done"]
    command: ['sh', '-c', "for i in {1..10}; do sleep 10; if nslookup google.com; then exit 0; fi; done; exit 1"]
    command:
  containers:
  - name: nginx
    imgae: nginx
   
